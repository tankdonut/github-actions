name: "Git Bot Config"
description: "Configure git identity for automated commits using GitHub Actions bot"

inputs:
  name:
    description: "Git user name"
    default: "github-actions[bot]"
  email:
    description: "Git user email (canonical GitHub bot format)"
    default: "41898282+github-actions[bot]@users.noreply.github.com"

runs:
  using: "composite"
  steps:
    - name: Configure git user name
      shell: bash
      env:
        # Env indirection: splicing inputs into run: via ${{ }} is expanded
        # before bash parses the script, enabling script injection.
        GIT_USER_NAME: ${{ inputs.name }}
      run: git config --global user.name "$GIT_USER_NAME"

    - name: Configure git user email
      shell: bash
      env:
        GIT_USER_EMAIL: ${{ inputs.email }}
      run: git config --global user.email "$GIT_USER_EMAIL"
