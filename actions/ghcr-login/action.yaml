name: "GHCR Login"
description: "Login to GitHub Container Registry using podman, docker, or crane"

inputs:
  runtime:
    description: "Container runtime to use: podman, docker, or crane"
    default: "podman"
  registry:
    description: "Container registry URL"
    default: "ghcr.io"
  username:
    description: "Registry username"
    default: "${{ github.actor }}"
  token:
    description: "Registry password/token"
    default: "${{ github.token }}"

runs:
  using: "composite"
  steps:
    - name: Login to container registry
      shell: bash
      env:
        # Env indirection: ${{ }} values spliced directly into run: scripts are
        # textually expanded before bash parses them, enabling script injection.
        # Shell variables are never re-parsed as operators.
        LOGIN_RUNTIME: ${{ inputs.runtime }}
        LOGIN_REGISTRY: ${{ inputs.registry }}
        LOGIN_USERNAME: ${{ inputs.username }}
        LOGIN_TOKEN: ${{ inputs.token }}
      run: |
        if [ "$LOGIN_RUNTIME" = "podman" ]; then
          printf '%s' "$LOGIN_TOKEN" | podman login "$LOGIN_REGISTRY" -u "$LOGIN_USERNAME" --password-stdin
        elif [ "$LOGIN_RUNTIME" = "docker" ]; then
          printf '%s' "$LOGIN_TOKEN" | docker login "$LOGIN_REGISTRY" -u "$LOGIN_USERNAME" --password-stdin
        elif [ "$LOGIN_RUNTIME" = "crane" ]; then
          printf '%s' "$LOGIN_TOKEN" | crane auth login "$LOGIN_REGISTRY" -u "$LOGIN_USERNAME" --password-stdin
        else
          echo "::error::Unsupported runtime: $LOGIN_RUNTIME. Must be podman, docker, or crane."
          exit 1
        fi
